<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coptic Manuscripts Museum</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--teal:#008573;--line:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Figtree,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.brand{text-align:center}
.brand b{display:block;font:400 2.1rem/1 Marcellus,serif;letter-spacing:.14em}
.hero{position:relative;height:min(78vh,820px);min-height:520px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 40%,rgba(0,0,0,.85) 100%)}
.hero h1{position:absolute;z-index:2;right:24px;left:24px;bottom:96px;margin:0;text-align:right;font:400 clamp(2.8rem,11vw,6rem)/1.05 Marcellus,serif;letter-spacing:.04em;text-transform:uppercase}
.hero p{position:absolute;z-index:2;right:24px;bottom:56px;margin:0;font:400 1.25rem Marcellus,serif;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
#bar{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:8px}
#bar button{font:600 .85rem Figtree,sans-serif;border:0;border-radius:30px;padding:11px 16px;background:#fff;color:#000;cursor:pointer}
body.edit [contenteditable]{outline:1px dashed #2fae9b;outline-offset:4px}
body.edit .hero{cursor:pointer}
:focus-visible{outline:2px solid #2fae9b;outline-offset:3px}
.tabsec{padding:0 0 120px}
#tbar{display:flex;gap:6px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line)}
#tbar .tb:first-child{margin-left:auto}#tbar .tb:last-child{margin-right:auto}
.tb{font:600 1rem Figtree,sans-serif;background:none;border:0;border-bottom:3px solid transparent;color:#9a9a9a;padding:22px 16px 14px;white-space:nowrap;cursor:pointer}
.tb.on{color:#fff;border-bottom-color:#fff}
#tpanel{max-width:760px;margin:0 auto;padding:28px 20px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.row input{flex:1;min-width:160px;background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:10px 12px;font:inherit}
.mb{font:600 .85rem Figtree,sans-serif;background:#111;color:#fff;border:1px solid #333;border-radius:30px;padding:9px 14px;cursor:pointer}
.mb.rec{background:#b3261e;border-color:#b3261e}
.blk{margin:0 0 26px}
.tx{font-size:1.15rem;line-height:1.7;white-space:pre-wrap;min-height:1.7em}
.md{display:block;width:100%;max-width:100%;border-radius:14px;background:#111}
audio.md{height:44px;border-radius:30px;background:transparent}
video.md{width:100%;max-width:100%;max-height:none;aspect-ratio:16/9;object-fit:contain;background:#000;margin:0 auto;border-radius:12px}
.ctl{display:flex;gap:6px;margin-top:8px}
.ctl .mb{padding:5px 12px}
.msg{color:#f2b8b5;font-size:.9rem}
.cards{display:grid;gap:12px}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#0b0b0b;border:1px solid var(--line);color:#fff;border-radius:16px;padding:22px 20px;font:400 1.25rem Marcellus,serif;letter-spacing:.06em;cursor:pointer}
.card span:last-child{color:#2fae9b}
.ptitle{font:400 clamp(2rem,8vw,3.4rem)/1.1 Marcellus,serif;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 24px;overflow-wrap:anywhere}
.pdf{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111;border:1px solid #333;border-radius:14px;padding:14px 16px}
.pdf span{overflow-wrap:anywhere}
.pdf a{flex:none;color:#fff;background:var(--teal);border-radius:30px;padding:9px 16px;text-decoration:none;font-weight:600;font-size:.9rem}
.empty{color:#9a9a9a}
.pgs canvas{display:block;width:100%;height:auto;margin-top:10px;border-radius:8px;background:#fff}
.pbtn{flex:none;font:600 .9rem Figtree,sans-serif;color:#fff;background:var(--teal);border:0;border-radius:30px;padding:9px 16px;cursor:pointer}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.mbox{width:100%;max-width:640px;height:min(80vh,760px);background:#0b0b0b;border:1px solid #333;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.mhd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #2a2a2a}
.mhd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhd a{flex:none;color:#fff;background:var(--teal);border-radius:30px;padding:7px 14px;text-decoration:none;font-weight:600;font-size:.85rem}
.xbtn{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#000;font-size:1rem;cursor:pointer}
.mbd{flex:1;overflow:auto;padding:0 12px 12px}
.blk.main{margin-bottom:34px}
.blk.main img.md{max-height:72vh;object-fit:cover;border-radius:18px}
.blk.main video.md{max-width:100%;max-height:none;aspect-ratio:16/9;border-radius:12px}
body.pg .hero{display:none}
.brand{cursor:pointer}
</style></head><body>

<script>
var els=[].slice.call(document.querySelectorAll('[data-k]')),body=document.body,img=document.getElementById('heroImg'),orig=img.src,st={};
try{st=JSON.parse(localStorage.getItem('pg')||'{}')}catch(e){}
els.forEach(function(e){if(st[e.dataset.k])e.textContent=st[e.dataset.k]});
if(st._img)img.src=st._img;
function save(){try{localStorage.setItem('pg',JSON.stringify(st))}catch(e){}}
els.forEach(function(e){e.addEventListener('input',function(){st[e.dataset.k]=e.textContent;save()})});
var t=document.getElementById('toggle'),r=document.getElementById('reset');
t.onclick=function(){var on=body.classList.toggle('edit');els.forEach(function(e){e.contentEditable=on});t.textContent=on?'Done':'Edit page';r.hidden=!on};
r.onclick=function(){st={};save();location.reload()};

document.getElementById('hero').onclick=function(e){if(body.classList.contains('edit')&&e.target===img)document.getElementById('file').click()};
document.getElementById('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){img.src=fr.result;st._img=fr.result;save()};fr.readAsDataURL(f)};
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},DB,mem={},urls={},rec=null,msg='',S={tabs:[{id:'t1',name:'Tab 1',blocks:[]}]};
var uid=function(){return Math.random().toString(36).slice(2,10)};
function open(){return new Promise(function(res){try{var q=indexedDB.open('mus',1);q.onupgradeneeded=function(){q.result.createObjectStore('s');q.result.createObjectStore('m')};q.onsuccess=function(){DB=q.result;res()};q.onerror=function(){res()}}catch(e){res()}})}
function get(st,k){return new Promise(function(res){if(!DB)return res();try{var r=DB.transaction(st).objectStore(st).get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){res()}}catch(e){res()}})}
function put(st,k,v){try{if(DB)DB.transaction(st,'readwrite').objectStore(st).put(v,k)}catch(e){}}
function del(st,k){try{if(DB)DB.transaction(st,'readwrite').objectStore(st).delete(k)}catch(e){}}
function save(){put('s','state',S)}
function route(){var m=/^#p-([a-z0-9]+)$/.exec(location.hash);if(m&&S.tabs.some(function(x){return x.id==m[1]}))return m[1];return null}
function cur(){var id=route();return S.tabs.filter(function(t){return t.id==id})[0]}
function url(m){if(!urls[m]&&mem[m])urls[m]=URL.createObjectURL(mem[m]);return urls[m]}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function btn(txt,fn,cls){var b=mk('button',cls||'mb',txt);b.type='button';b.onclick=fn;return b}
function drop(b){if(b.mid){del('m',b.mid);delete mem[b.mid]}}
function grp(b){return b.type=='image'||b.type=='video'?0:b.type=='text'?1:b.type=='audio'?2:3}
function mv(t,b,d){var a=t.blocks,i=a.indexOf(b),j=i+d;while(j>=0&&j<a.length&&grp(a[j])!=grp(b))j+=d;if(j<0||j>=a.length)return;var x=a[i];a[i]=a[j];a[j]=x;save();render()}
function pick(type,acc){var f=$('mfile');f.accept=acc;f.dataset.type=type;f.value='';f.click()}
function addMedia(blob,type,name){var t=cur();if(!t)return;var m=uid();mem[m]=blob;put('m',m,blob);t.blocks.push({id:uid(),type:type,mid:m,name:name||''});save()}
$('mfile').onchange=function(e){var ty=e.target.dataset.type;[].forEach.call(e.target.files,function(f){addMedia(f,ty,f.name)});render()};
function toggleRec(){
if(rec){rec.stop();return}
if(!navigator.mediaDevices||!window.MediaRecorder){msg='Recording is not supported here. Use + Voice file instead.';render();return}
navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
var ch=[],r=new MediaRecorder(s);rec=r;
r.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
r.onstop=function(){s.getTracks().forEach(function(x){x.stop()});addMedia(new Blob(ch,{type:r.mimeType||'audio/webm'}),'audio');rec=null;msg='';render()};
r.start();msg='';render()
}).catch(function(){msg='Microphone not allowed. Use + Voice file instead.';render()})}
var PJ='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(cb){if(window.pdfjsLib)return cb(window.pdfjsLib);var s=document.createElement('script');s.src=PJ+'pdf.min.js';s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PJ+'pdf.worker.min.js'}catch(e){}cb(window.pdfjsLib)};s.onerror=function(){cb(null)};document.head.appendChild(s)}
function showPdf(box,blob){
if(!blob){box.appendChild(mk('p','msg','File not found.'));return}
box.appendChild(mk('p','empty','Loading PDF...'));
loadPdfJs(function(lib){
if(!lib){box.innerHTML='';box.appendChild(mk('p','msg','Could not show the PDF here. Use Download.'));return}
blob.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise}).then(function(pdf){
box.innerHTML='';
var n=Math.min(pdf.numPages,60),i=1;
(function next(){if(i>n)return;pdf.getPage(i++).then(function(p){
var w=box.clientWidth||700,v0=p.getViewport({scale:1}),sc=(w/v0.width)*Math.min(window.devicePixelRatio||1,2),v=p.getViewport({scale:sc});
var c=document.createElement('canvas');c.width=v.width;c.height=v.height;box.appendChild(c);
return p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}).then(next)})()
}).catch(function(){box.innerHTML='';box.appendChild(mk('p','msg','Could not show the PDF. Use Download.'))})})}
function openPdf(b){
var ov=mk('div','ovl'),box=mk('div','mbox'),hd=mk('div','mhd'),bd=mk('div','mbd pgs');
function close(){ov.remove();document.removeEventListener('keydown',esc);document.body.style.overflow=''}
function esc(e){if(e.key=='Escape')close()}
hd.appendChild(mk('span',null,b.name||'PDF'));
var a=mk('a',null,'Download');if(url(b.mid)){a.href=url(b.mid);a.download=b.name||'file.pdf'}hd.appendChild(a);
hd.appendChild(btn('\u2715',close,'xbtn'));
box.appendChild(hd);box.appendChild(bd);ov.appendChild(box);
ov.onclick=function(e){if(e.target===ov)close()};
document.addEventListener('keydown',esc);document.body.style.overflow='hidden';document.body.appendChild(ov);
showPdf(bd,mem[b.mid])}
function home(){location.hash='home'}
function render(){
var ed=document.body.classList.contains('edit'),pn=$('tpanel'),t=cur();
pn.innerHTML='';
document.body.classList.toggle('pg',!!t);
if(!t){
var g=mk('div','cards');
S.tabs.forEach(function(x){var c=btn('','','card');c.appendChild(mk('span',null,x.name));c.appendChild(mk('span',null,'\u2192'));c.onclick=function(){location.hash='p-'+x.id};g.appendChild(c)});
pn.appendChild(g);
if(ed){var r0=mk('div','row');r0.style.marginTop='18px';r0.appendChild(btn('+ New piece',function(){var n={id:uid(),name:'New piece',blocks:[]};S.tabs.push(n);save();location.hash='p-'+n.id}));pn.appendChild(r0)}
return}
var top=mk('div','row');top.appendChild(btn('\u2190 Back',home));pn.appendChild(top);
pn.appendChild(mk('h2','ptitle',t.name));
if(ed){
var row=mk('div','row'),inp=mk('input');inp.value=t.name;
inp.oninput=function(){t.name=inp.value;save();var h=pn.querySelector('.ptitle');if(h)h.textContent=inp.value};
row.appendChild(inp);
var d=btn('Delete',function(){if(d.dataset.s!='1'){d.dataset.s='1';d.textContent='Tap again to delete';return}
t.blocks.forEach(drop);S.tabs=S.tabs.filter(function(x){return x!=t});
if(!S.tabs.length)S.tabs.push({id:uid(),name:'Tab 1',blocks:[]});save();home()});
row.appendChild(d);pn.appendChild(row);
var ad=mk('div','row');
ad.appendChild(btn('+ Text',function(){t.blocks.push({id:uid(),type:'text',text:'Write here'});save();render()}));
[['+ Image','image','image/*'],['+ Video','video','video/*'],['+ Voice file','audio','audio/*'],['+ PDF','pdf','application/pdf']].forEach(function(a){ad.appendChild(btn(a[0],function(){pick(a[1],a[2])}))});
var rb=btn(rec?'Stop recording':'Record voice',toggleRec);if(rec)rb.classList.add('rec');ad.appendChild(rb);
pn.appendChild(ad);
if(msg)pn.appendChild(mk('p','msg',msg));
}
if(!t.blocks.length&&!ed)pn.appendChild(mk('p','empty','Coming soon'));
var ord=[],mn=t.blocks.filter(function(x){return x.id==t.main&&grp(x)==0})[0];if(mn)ord.push(mn);
[0,1,2,3].forEach(function(gi){t.blocks.forEach(function(b){if(grp(b)==gi&&b!==mn)ord.push(b)})});
ord.forEach(function(b){
var w=mk('div','blk'+(b===mn?' main':'')),e;
if(b.type=='text'){e=mk('div','tx',b.text);e.contentEditable=ed;e.oninput=function(){b.text=e.innerText;save()}}
else if(b.type=='pdf'){e=mk('div','pdf');e.appendChild(mk('span',null,b.name||'PDF'));e.appendChild(btn('Open PDF',function(){openPdf(b)},'pbtn'))}
else{e=mk(b.type=='image'?'img':b.type,'md');if(url(b.mid))e.src=url(b.mid);if(b.type=='image')e.alt='';else e.controls=true}
w.appendChild(e);
if(ed){var c=mk('div','ctl');
if(grp(b)==0)c.appendChild(btn(b===mn?'\u2605 Main':'\u2606 Make main',function(){t.main=(b===mn?null:b.id);save();render()}));
c.appendChild(btn('\u2191',function(){mv(t,b,-1)}));c.appendChild(btn('\u2193',function(){mv(t,b,1)}));
c.appendChild(btn('\u2715',function(){t.blocks.splice(t.blocks.indexOf(b),1);drop(b);save();render()}));w.appendChild(c)}
pn.appendChild(w)})}
$('toggle').addEventListener('click',function(){setTimeout(render,0)});
document.querySelector('.brand').addEventListener('click',function(){if(!document.body.classList.contains('edit'))home()});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
open().then(function(){return get('s','state')}).then(function(s){
if(s&&s.tabs&&s.tabs.length)S=s;
if(!S.seeded20){var n0=S.tabs.length;for(var i=1;i<=20;i++)S.tabs.push({id:uid(),name:'Tab '+(n0+i),blocks:[]});S.seeded20=true;save()}
var ps=[];S.tabs.forEach(function(t){t.blocks.forEach(function(b){if(b.mid)ps.push(get('m',b.mid).then(function(v){if(v)mem[b.mid]=v}))})});
return Promise.all(ps)}).then(render,render);
})();
</script></body></html>
